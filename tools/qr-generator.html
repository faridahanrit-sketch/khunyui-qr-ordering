<!doctype html><html lang="th"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KHUNYUI QR Generator</title><style>body{font-family:Arial,"Noto Sans Thai",sans-serif;max-width:720px;margin:40px auto;padding:0 18px;color:#171717}h1{font-size:24px}.box{border:1px solid #ddd;border-radius:14px;padding:18px}label{display:block;font-weight:700;margin-top:12px}input,select,button{width:100%;box-sizing:border-box;min-height:46px;margin-top:6px;padding:10px;border:1px solid #ccc;border-radius:9px;font:inherit}button{background:#D52228;color:white;border:0;font-weight:800;margin-top:16px}#qr{display:grid;place-items:center;margin:24px auto 10px;min-height:260px}.url{word-break:break-all;color:#666;font-size:13px;text-align:center}@media print{form,h1,p{display:none}.box{border:0}#qr{margin-top:40px}}</style></head><body><h1>สร้าง QR ลูกค้า — KHUNYUI</h1><p>ใส่ URL GitHub Pages ของหน้าลูกค้า แล้วกดสร้าง QR</p><div class="box"><form id="f"><label>Customer URL</label><input id="base" placeholder="https://USERNAME.github.io/REPO/" required><label>QR Token</label><input id="token" value="KHUNYUI-MAIN-2026" required><button>สร้าง QR</button></form><div id="qr"></div><div class="url" id="out"></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const b=document.getElementById('base').value.trim();const t=document.getElementById('token').value.trim();const u=new URL(b);u.searchParams.set('q',t);document.getElementById('qr').innerHTML='';new QRCode(document.getElementById('qr'),{text:u.toString(),width:256,height:256});document.getElementById('out').textContent=u.toString()})</script></body></html>
